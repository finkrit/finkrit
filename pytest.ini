[pytest]
# Sources live under packages/ and services/api/. Put those on the import path
# so a fresh clone resolves finkritq, finagent, finkritintel, and finkritserver
# with no manual .pth or PYTHONPATH, and collect the tests from there.
#
# tests/ holds the repo level guards, the wheel manifest and the README
# contracts. It must be in testpaths: they exist to fail the default `pytest`
# run before a release, and a guard that only runs when someone remembers to
# name it is the exact failure mode it was written against.
pythonpath = packages services/api
testpaths = packages services/api tests
norecursedirs =
    .finkritvenv
    .git
    __pycache__
    node_modules
